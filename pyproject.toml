[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "PyAutoGUI>=0.9.54",
    "Pillow>=10.0.0",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.14",
    "pyttsx3>=2.90",
]

[project.scripts]
aura = "aura.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aura"]
