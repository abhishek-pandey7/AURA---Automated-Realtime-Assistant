[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aura-agent"
version = "0.1.0"
description = "AURA — Automated Realtime Assistant. A CLI agentic AI system."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
aura = "aura.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aura*"]
